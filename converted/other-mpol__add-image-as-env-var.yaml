apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-add-image-as-env-var-bd77d4
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: "object.spec.containers.map(c, \n  !has(c.env) ? \n  JSONPatch{\n\
        \    op: \"add\",\n    path: \"/spec/containers/\" + string(object.spec.containers.indexOf(c))\
        \ + \"/env\",\n    value: [{\"name\": \"K8S_IMAGE\", \"value\": string(c.image)}]\n\
        \  } :\n  JSONPatch{\n    op: \"add\",\n    path: \"/spec/containers/\" +\
        \ string(object.spec.containers.indexOf(c)) + \"/env/-\",\n    value: {\"\
        name\": \"K8S_IMAGE\", \"value\": string(c.image)}\n  }\n)"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: other-mpol-add-image-as-env-var-bd77d4-b
spec:
  policyName: other-mpol-add-image-as-env-var-bd77d4
---
