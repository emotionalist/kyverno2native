apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-memory-requests-equal-limits-54dc47
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container,  !container.?resources.?requests.?memory.hasValue()
      || container.resources.requests.memory == container.resources.?limits.?memory.orValue('-1'))
    message: resources.requests.memory must be equal to resources.limits.memory
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-memory-requests-equal-limits-54dc47-b
spec:
  policyName: other-cel-memory-requests-equal-limits-54dc47
  validationActions:
  - Deny
