metadata:
  name: linkerd-prevent-linkerd-pod-injection-overri-1eac1d
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (has(object.metadata) && ((!(has(object.metadata.annotations)) ||
      (has(object.metadata.annotations) && ((!("linkerd.io/inject" in object.metadata.annotations)
