apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-block-pod-exec-by-pod-and-contain-ad48e6
spec:
  matchConstraints:
    resourceRules:
    - resources:
      - pods/exec
      operations:
      - CONNECT
      apiGroups:
      - ''
      apiVersions:
      - v1
  validations:
  - message: Nginx containers inside myapp-maintenance Pods may not be exec'd into.
    expression: '!(request.name.startsWith(''myapp-maintenance'') && has(object.container)
      && object.container == ''nginx'')'
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-block-pod-exec-by-pod-and-contain-ad48e6-b
spec:
  policyName: other-vpol-block-pod-exec-by-pod-and-contain-ad48e6
  validationActions:
  - Deny
