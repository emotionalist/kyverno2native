apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-restrict-pod-controller-serviceacc-5a4deb-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations: &id001
      - CREATE
      - UPDATE
      resources:
      - replicationcontrollers
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations: *id001
      resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations: *id001
      resources:
      - jobs
  validations:
  - expression: object.spec.template.spec.?serviceAccountName.orValue('empty') ==
      oldObject.spec.template.spec.?serviceAccountName.orValue('empty')
    message: The serviceAccountName field may not be changed once created.
  matchConditions:
  - name: operation-should-be-update
    expression: request.operation == 'UPDATE'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-restrict-pod-controller-serviceacc-5a4deb-r0-b
spec:
  policyName: other-cel-restrict-pod-controller-serviceacc-5a4deb-r0
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-restrict-pod-controller-serviceacc-5a4deb-r1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - cronjobs
  validations:
  - expression: object.spec.jobTemplate.spec.template.spec.?serviceAccountName.orValue('empty')
      == oldObject.spec.jobTemplate.spec.template.spec.?serviceAccountName.orValue('empty')
  matchConditions:
  - name: operation-should-be-update
    expression: request.operation == 'UPDATE'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-restrict-pod-controller-serviceacc-5a4deb-r1-b
spec:
  policyName: other-cel-restrict-pod-controller-serviceacc-5a4deb-r1
  validationActions:
  - Deny
