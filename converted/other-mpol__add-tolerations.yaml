apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-add-tolerations-19ab48
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: skip-if-toleration-exists
    expression: "!has(object.spec.tolerations) || \nobject.spec.tolerations == null\
      \ || \n!object.spec.tolerations.exists(t, t.key == \"org.com/role\")\n"
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: "(!has(object.spec.tolerations) || object.spec.tolerations == null)\
        \ ?\n  [\n    JSONPatch{\n      op: \"add\",\n      path: \"/spec/tolerations\"\
        ,\n      value: [dyn({\n        \"key\": \"org.com/role\",\n        \"operator\"\
        : \"Equal\",\n        \"value\": \"service\",\n        \"effect\": \"NoSchedule\"\
        \n      })]\n    }\n  ] :\n  [\n    JSONPatch{\n      op: \"add\",\n     \
        \ path: \"/spec/tolerations/-\",\n      value: dyn({\n        \"key\": \"\
        org.com/role\",\n        \"operator\": \"Equal\",\n        \"value\": \"service\"\
        ,\n        \"effect\": \"NoSchedule\"\n      })\n    }\n  ]\n"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: other-mpol-add-tolerations-19ab48-b
spec:
  policyName: other-mpol-add-tolerations-19ab48
---
