apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-deny-secret-service-account-token-type-81ab99
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
  validations:
  - expression: (has(object.type) && (object.type != "kubernetes.io/service-account-token"))
    message: Secret ServiceAccount token type is not allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-deny-secret-service-account-token-type-81ab99-b
spec:
  policyName: other-deny-secret-service-account-token-type-81ab99
  validationActions:
  - Deny
