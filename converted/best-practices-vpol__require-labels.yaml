apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-vpol-require-labels-9e57ea
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels
      && object.metadata.labels['app.kubernetes.io/name'] != ''
    messageExpression: '''Pod '' + object.metadata.name + '' must have the label app.kubernetes.io/name
      with a non-empty value. Found labels: '' + (has(object.metadata.labels) ? string(object.metadata.labels)
      : ''none'')'
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-vpol-require-labels-9e57ea-b
spec:
  policyName: best-practices-vpol-require-labels-9e57ea
  validationActions:
  - Deny
---
