apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-loadbalancer-9bf415
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: (has(object.spec) && ((has(object.spec.type) && (object.spec.type
      != "LoadBalancer"))))
    message: Service of type LoadBalancer is not allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-loadbalancer-9bf415-b
spec:
  policyName: other-restrict-loadbalancer-9bf415
  validationActions:
  - Deny
