apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-enforce-pod-duration-bdbc17
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: hasLifetimeAnnotation
    expression: object.metadata.?annotations[?'pod.kubernetes.io/lifetime'].hasValue()
  - name: lifetimeAnnotationValue
    expression: 'variables.hasLifetimeAnnotation ? object.metadata.annotations[''pod.kubernetes.io/lifetime'']
      : ''0s'''
  validations:
  - expression: '!(duration(variables.lifetimeAnnotationValue) > duration(''8h''))'
    message: Pod lifetime exceeds limit of 8h
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-enforce-pod-duration-bdbc17-b
spec:
  policyName: other-vpol-enforce-pod-duration-bdbc17
  validationActions:
  - Deny
---
