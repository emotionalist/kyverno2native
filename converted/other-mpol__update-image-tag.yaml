apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-update-image-tag-4bc479
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      resources:
      - deployments
      operations:
      - CREATE
      - UPDATE
  matchConditions:
  - name: has-vault-inject-annotation
    expression: has(object.metadata.annotations) && object.metadata.annotations['vault.hashicorp.com/agent-inject']
      == 'true'
  variables:
  - name: containers
    expression: object.spec.template.spec.containers
  - name: vaultAgentIndex
    expression: variables.containers.map(c, c.name).indexOf('vault-agent')
  - name: hasVaultAgent
    expression: variables.vaultAgentIndex >= 0
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: "variables.hasVaultAgent ? [\n  JSONPatch{\n    op: \"replace\"\
        ,\n    path: \"/spec/template/spec/containers/\" + string(variables.vaultAgentIndex)\
        \ + \"/image\",\n    value: \"vault:1.5.4\"\n  }\n] : []"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: other-mpol-update-image-tag-4bc479-b
spec:
  policyName: other-mpol-update-image-tag-4bc479
