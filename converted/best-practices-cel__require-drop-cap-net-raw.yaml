apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-cel-require-drop-cap-net-raw-1456d4
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container,  container.?securityContext.?capabilities.?drop.orValue([]).exists(capability,
      capability.upperAscii() in variables.mustDropCapabilities))
    message: Containers must drop the `CAP_NET_RAW` capability.
  variables:
  - name: mustDropCapabilities
    expression: '[''CAP_NET_RAW'',''NET_RAW'']'
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-cel-require-drop-cap-net-raw-1456d4-b
spec:
  policyName: best-practices-cel-require-drop-cap-net-raw-1456d4
  validationActions:
  - Deny
---
