apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-cel-require-pod-requests-limi-fbf393
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, has(container.resources) &&
      has(container.resources.requests) && has(container.resources.requests.memory)
      && has(container.resources.requests.cpu) && has(container.resources.limits)
      && has(container.resources.limits.memory))
    message: CPU and memory resource requests and limits are required.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-cel-require-pod-requests-limi-fbf393-b
spec:
  policyName: best-practices-cel-require-pod-requests-limi-fbf393
  validationActions:
  - Deny
---
