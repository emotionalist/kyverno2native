apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-restrict-ingress-classes-d1850f
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: object.metadata.?annotations[?'kubernetes.io/ingress.class'].orValue('')
      in ['HAProxy', 'nginx']
    message: Unknown ingress class.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-restrict-ingress-classes-d1850f-b
spec:
  policyName: other-vpol-restrict-ingress-classes-d1850f
  validationActions:
  - Deny
