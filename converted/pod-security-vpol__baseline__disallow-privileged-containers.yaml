apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-vpol-baseline-disallow-privileg-b39893
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers +  object.spec.?initContainers.orValue([])
      +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: variables.allContainers.all(container, container.?securityContext.?privileged.orValue(false)
      == false)
    message: Privileged mode is disallowed. All containers must set the securityContext.privileged
      field to `false` or unset the field.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-vpol-baseline-disallow-privileg-b39893-b
spec:
  policyName: pod-security-vpol-baseline-disallow-privileg-b39893
  validationActions:
  - Deny
---
