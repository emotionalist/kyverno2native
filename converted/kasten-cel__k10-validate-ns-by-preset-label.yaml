apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kasten-cel-k10-validate-ns-by-preset-label-cd9172
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - namespaces
  validations:
  - expression: object.metadata.?labels.?dataprotection.orValue('') in ['gold', 'silver',
      'bronze', 'none']
    message: 'Namespaces must specify a "dataprotection" label with a value corresponding
      to a Kasten K10 SLA: "gold" - <Insert human readable settings of each preset
      option>; "silver" - <For example, hourly backups, exported to immutable S3 storage>;
      "bronze" - <Or, daily local snapshots, NOT exported to external storage>; "none"
      - No local snapshots or backups'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kasten-cel-k10-validate-ns-by-preset-label-cd9172-b
spec:
  policyName: kasten-cel-k10-validate-ns-by-preset-label-cd9172
  validationActions:
  - Deny
