apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-vpol-disallow-cri-sock-mount-0de192
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: hasVolumes
    expression: '!has(object.spec.volumes)'
  - name: volumes
    expression: object.spec.volumes
  - name: volumesWithHostPath
    expression: variables.volumes.filter(volume, has(volume.hostPath))
  validations:
  - expression: variables.hasVolumes ||  variables.volumesWithHostPath.all(volume,
      !volume.hostPath.path.matches('/var/run/docker.sock'))
    message: Use of the Docker Unix socket is not allowed.
  - expression: variables.hasVolumes ||  variables.volumesWithHostPath.all(volume,
      !volume.hostPath.path.matches('/var/run/containerd/containerd.sock'))
    message: Use of the Containerd Unix socket is not allowed.
  - expression: variables.hasVolumes ||  variables.volumesWithHostPath.all(volume,
      !volume.hostPath.path.matches('/var/run/crio/crio.sock'))
    message: Use of the CRI-O Unix socket is not allowed.
  - expression: variables.hasVolumes ||  variables.volumesWithHostPath.all(volume,
      !volume.hostPath.path.matches('/var/run/cri-dockerd.sock'))
    message: Use of the Docker CRI socket is not allowed.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-vpol-disallow-cri-sock-mount-0de192-b
spec:
  policyName: best-practices-vpol-disallow-cri-sock-mount-0de192
  validationActions:
  - Deny
---
