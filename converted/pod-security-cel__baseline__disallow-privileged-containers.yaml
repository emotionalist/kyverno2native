apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-baseline-disallow-privilege-ef2532
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container, container.?securityContext.?privileged.orValue(false)
      == false)
    message: Privileged mode is disallowed. All containers must set the securityContext.privileged
      field to `false` or unset the field.
  variables:
  - name: allContainers
    expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers
      : []))'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-baseline-disallow-privilege-ef2532-b
spec:
  policyName: pod-security-cel-baseline-disallow-privilege-ef2532
  validationActions:
  - Deny
---
