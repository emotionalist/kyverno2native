apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: linkerd-cel-prevent-linkerd-port-skipping-2922d2
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '!has(object.metadata.annotations) ||  (!(''config.linkerd.io/skip-inbound-ports''
      in object.metadata.annotations) && !(''config.linkerd.io/skip-outbound-ports''
      in object.metadata.annotations))'
    message: Pods may not skip ports. The annotations `config.linkerd.io/skip-inbound-ports`
      or `config.linkerd.io/skip-outbound-ports` must not be set.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: linkerd-cel-prevent-linkerd-port-skipping-2922d2-b
spec:
  policyName: linkerd-cel-prevent-linkerd-port-skipping-2922d2
  validationActions:
  - Deny
---
