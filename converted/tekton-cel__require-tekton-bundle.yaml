apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tekton-cel-require-tekton-bundle-3e877a-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - tekton.dev
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pipelineruns
  validations:
  - expression: object.spec.?pipelineRef.?bundle.orValue('') != ''
