apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-ensure-readonly-hostpath-08f190
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.hostPathVolumes.all(hostPath, variables.allContainers.all(container,  container.volumeMounts.orValue([]).all(volume,
      (hostPath.name != volume.name) || volume.?readOnly.orValue(false) == true)))
    message: All hostPath volumes must be mounted as readOnly.
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: hostPathVolumes
    expression: object.spec.?volumes.orValue([]).filter(volume, has(volume.hostPath))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-ensure-readonly-hostpath-08f190-b
spec:
  policyName: other-cel-ensure-readonly-hostpath-08f190
  validationActions:
  - Deny
---
