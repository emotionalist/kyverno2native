apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-vpol-disallow-empty-ingress-h-f62dc1
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: object.spec.?rules.orValue([]).all(rule, has(rule.host) && has(rule.http))
    message: The Ingress host name must be defined, not empty.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-vpol-disallow-empty-ingress-h-f62dc1-b
spec:
  policyName: best-practices-vpol-disallow-empty-ingress-h-f62dc1
  validationActions:
  - Deny
