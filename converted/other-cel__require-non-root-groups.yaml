apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-require-non-root-groups-b8bff3-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: "(\n  object.spec.?securityContext.?runAsGroup.orValue(-1) > 0 &&\n\
      \  variables.allContainers.all(container, container.?securityContext.?runAsGroup.orValue(1)\
      \ > 0)\n) || (\n  variables.allContainers.all(container, container.?securityContext.?runAsGroup.orValue(-1)\
      \ > 0) \n)"
    message: Running with root group IDs is disallowed. The fields spec.securityContext.runAsGroup,
      spec.containers[*].securityContext.runAsGroup, spec.initContainers[*].securityContext.runAsGroup,
      and spec.ephemeralContainers[*].securityContext.runAsGroup must be set to a
      value greater than zero.
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-require-non-root-groups-b8bff3-r0-b
spec:
  policyName: other-cel-require-non-root-groups-b8bff3-r0
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-require-non-root-groups-b8bff3-r1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.?securityContext.?supplementalGroups.orValue([]).all(group,
      group > 0)
    message: Containers cannot run with a root primary or supplementary GID. The field
      spec.securityContext.supplementalGroups must be unset or set to a value greater
      than zero.
---
