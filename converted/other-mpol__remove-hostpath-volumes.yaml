apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-remove-hostpath-volumes-175ab4
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: hostpathVolumes
    expression: "has(object.spec.volumes) ? \n  object.spec.volumes.filter(v, has(v.hostPath)).map(v, v.name) : \n  []\n"
  - name: hasHostPath
    expression: |
      variables.hostpathVolumes.size() > 0
  matchConditions:
  - name: has-hostpath-volumes
    expression: has(object.spec.volumes) && object.spec.volumes.exists(v, has(v.hostPath))
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |-
        [
          JSONPatch{
            op: "replace",
            path: "/spec/volumes",
            value: object.spec.volumes.filter(v, !has(v.hostPath))
          }
        ] +
        object.spec.containers.map(c,
          has(c.volumeMounts) ?
            (c.volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name)).size() > 0 ?
              JSONPatch{
                op: "replace",
                path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts",
                value: c.volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name))
              } :
              JSONPatch{
                op: "remove",
                path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts"
              })
          : JSONPatch{op: "test", path: "/", value: null}
        ).filter(p, p.op != "test") +
        (has(object.spec.initContainers) ?
          object.spec.initContainers.map(c,
            has(c.volumeMounts) ?
              (c.volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name)).size() > 0 ?
                JSONPatch{
                  op: "replace",
                  path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/volumeMounts",
                  value: c.volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name))
                } :
                JSONPatch{
                  op: "remove",
                  path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/volumeMounts"
                })
            : JSONPatch{op: "test", path: "/", value: null}
          ).filter(p, p.op != "test") : []) +
        (has(object.spec.ephemeralContainers) ?
          object.spec.ephemeralContainers.map(c,
            has(c.volumeMounts) ?
              (c.volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name)).size() > 0 ?
                JSONPatch{
                  op: "replace",
                  path: "/spec/ephemeralContainers/" + string(object.spec.ephemeralContainers.indexOf(c)) + "/volumeMounts",
                  value: c.volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name))
                } :
                JSONPatch{
                  op: "remove",
                  path: "/spec/ephemeralContainers/" + string(object.spec.ephemeralContainers.indexOf(c)) + "/volumeMounts"
                })
            : JSONPatch{op: "test", path: "/", value: null}
          ).filter(p, p.op != "test") : [])
  failurePolicy: Fail
  reinvocationPolicy: Never
---
