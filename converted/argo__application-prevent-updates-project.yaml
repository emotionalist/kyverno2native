apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argo-application-prevent-updates-project-6bb7f6
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - argoproj.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - applications
  validations:
  - expression: '!(((object.spec.project != oldObject.spec.project)))'
    message: The spec.project cannot be changed once the Application is created.
  matchConditions:
  - name: preconditions
    expression: (request.operation == "UPDATE")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argo-application-prevent-updates-project-6bb7f6-b
spec:
  policyName: argo-application-prevent-updates-project-6bb7f6
  validationActions:
  - Deny
