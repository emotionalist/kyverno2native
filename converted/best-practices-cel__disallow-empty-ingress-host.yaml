apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-cel-disallow-empty-ingress-ho-8ec9e3
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: object.spec.?rules.orValue([]).all(rule, has(rule.host) && has(rule.http))
    message: The Ingress host name must be defined, not empty.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-cel-disallow-empty-ingress-ho-8ec9e3-b
spec:
  policyName: best-practices-cel-disallow-empty-ingress-ho-8ec9e3
  validationActions:
  - Deny
