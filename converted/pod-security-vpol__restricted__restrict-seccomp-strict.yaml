apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-vpol-restricted-restrict-seccom-52a5f5
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers +  object.spec.?initContainers.orValue([])
      +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: object.spec.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault')
      in ['RuntimeDefault', 'Localhost'] && variables.allContainers.all(container,  container.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault')
      in ['RuntimeDefault', 'Localhost'])
    message: seccompProfile.type must be either 'RuntimeDefault' or 'Localhost'.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-vpol-restricted-restrict-seccom-52a5f5-b
spec:
  policyName: pod-security-vpol-restricted-restrict-seccom-52a5f5
  validationActions:
  - Deny
---
