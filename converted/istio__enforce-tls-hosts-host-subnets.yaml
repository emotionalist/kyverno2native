apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: istio-enforce-tls-hosts-host-subnets-6a1128
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.istio.io
      apiVersions:
      - v1alpha3
      operations:
      - CREATE
      - UPDATE
      resources:
      - destinationrules
  validations:
  - expression: (!(has(object.spec)) || (has(object.spec) && ((!(has(object.spec.trafficPolicy))
      || (has(object.spec.trafficPolicy) && ((!(has(object.spec.trafficPolicy.tls))
      || (has(object.spec.trafficPolicy.tls) && ((!(has(object.spec.trafficPolicy.tls.mode))
      || (has(object.spec.trafficPolicy.tls.mode) && (object.spec.trafficPolicy.tls.mode
      != "DISABLE"))))))))))))
    message: TLS may not be disabled for the trafficPolicy in any host.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: istio-enforce-tls-hosts-host-subnets-6a1128-b
spec:
  policyName: istio-enforce-tls-hosts-host-subnets-6a1128
  validationActions:
  - Deny
