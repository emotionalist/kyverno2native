apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-disallow-secrets-from-env-vars-aaa3e2
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, container.?env.orValue([]).all(env,
      env.?valueFrom.?secretKeyRef.orValue(true)))
    message: Secrets must be mounted as volumes, not as environment variables.
  - expression: object.spec.containers.all(container, container.?envFrom.orValue([]).all(envFrom,
      !has(envFrom.secretRef)))
    message: Secrets must not come from envFrom statements.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-disallow-secrets-from-env-vars-aaa3e2-b
spec:
  policyName: other-cel-disallow-secrets-from-env-vars-aaa3e2
  validationActions:
  - Deny
---
