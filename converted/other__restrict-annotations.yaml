apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-annotations-679eca
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations: &id001
      - CREATE
      - UPDATE
      resources:
      - pods
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations: *id001
      resources:
      - daemonsets
      - deployments
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations: *id001
      resources:
      - cronjobs
      - jobs
  validations:
  - expression: (has(object.metadata) && ((!(has(object.metadata.annotations)) ||
      (has(object.metadata.annotations) && ((!has(object.metadata.annotations) ||
      !object.metadata.annotations.exists(__k2, __k2.matches("^fluxcd\\.io/.*$") &&
      (object.metadata.annotations[__k2].matches("^.*.$")))))))))
    message: Cannot use Flux v1 annotation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-annotations-679eca-b
spec:
  policyName: other-restrict-annotations-679eca
  validationActions:
  - Deny
