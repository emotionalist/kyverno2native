apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: best-practices-mpol-add-safe-to-evict-97ea1a
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: has-emptydir-or-hostpath
    expression: "has(object.spec.volumes) && \nobject.spec.volumes.exists(v, has(v.emptyDir)\
      \ || has(v.hostPath))\n"
  - name: annotation-not-present
    expression: "!has(object.metadata.annotations) || \n!object.metadata.annotations.exists(k,\
      \ k == 'cluster-autoscaler.kubernetes.io/safe-to-evict')\n"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{\n  metadata: Object.metadata{\n    annotations: {\n   \
        \   \"cluster-autoscaler.kubernetes.io/safe-to-evict\": \"true\"\n    }\n\
        \  }\n}"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
