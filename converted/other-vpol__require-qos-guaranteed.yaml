apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-require-qos-guaranteed-0e3b4f
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, has(container.resources) &&
      container.resources.?requests.orValue({}).?cpu.hasValue() && container.resources.?requests.orValue({}).?memory.hasValue()
      && container.resources.?limits.orValue({}).?cpu.hasValue() && container.resources.?limits.orValue({}).?memory.hasValue()
      && container.resources.requests.orValue({}).cpu == container.resources.limits.orValue({}).cpu
      && container.resources.requests.orValue({}).memory == container.resources.limits.orValue({}).memory)
    message: All containers must define memory and CPU requests and limits where they
      are equal.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-require-qos-guaranteed-0e3b4f-b
spec:
  policyName: other-vpol-require-qos-guaranteed-0e3b4f
  validationActions:
  - Deny
---
