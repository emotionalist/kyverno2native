apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: linkerd-prevent-linkerd-port-skipping-82350c
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (has(object.metadata) && ((!(has(object.metadata.annotations)) ||
      (has(object.metadata.annotations) && ((!("config.linkerd.io/skip-inbound-ports"
      in object.metadata.annotations)) && (!("config.linkerd.io/skip-outbound-ports"
      in object.metadata.annotations)))))))
    message: Pods may not skip ports. The annotations `config.linkerd.io/skip-inbound-ports`
      or `config.linkerd.io/skip-outbound-ports` must not be set.
---
apiVersion: admissionregistration.k8s.io/v1
