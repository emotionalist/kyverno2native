apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-vpol-require-ro-rootfs-ccfa8e
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container, has(container.securityContext)
      && has(container.securityContext.readOnlyRootFilesystem) && container.securityContext.readOnlyRootFilesystem
      == true)
    message: Root filesystem must be read-only.
  variables:
  - expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
    name: allContainers
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-vpol-require-ro-rootfs-ccfa8e-b
spec:
  policyName: best-practices-vpol-require-ro-rootfs-ccfa8e
  validationActions:
  - Deny
---
