apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-restrict-pod-controller-serviceac-ec70d5
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - deployments
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - UPDATE
      resources:
      - cronjobs
  validations:
  - expression: object.spec.template.?spec.?serviceAccountName.orValue('') == oldObject.spec.template.?spec.?serviceAccountName.orValue('')
      || object.spec.jobTemplate.?spec.?template.?spec.?serviceAccountName.orValue('')
      == oldObject.spec.jobTemplate.?spec.?template.?spec.?serviceAccountName.orValue('')
    message: The serviceAccountName field may not be changed once created.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-restrict-pod-controller-serviceac-ec70d5-b
spec:
  policyName: other-vpol-restrict-pod-controller-serviceac-ec70d5
  validationActions:
  - Deny
