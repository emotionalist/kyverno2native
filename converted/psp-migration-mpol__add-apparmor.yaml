apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: psp-migration-mpol-add-apparmor-0b72b9
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: 'object.spec.containers +  (has(object.spec.initContainers) ? object.spec.initContainers
      : []) +  (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers
      : [])'
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: "!has(object.metadata.annotations) ?\n[\n  JSONPatch{\n    op: \"\
        add\",\n    path: \"/metadata/annotations\",\n    value: {}\n  }\n] : []\n"
  - patchType: JSONPatch
    jsonPatch:
      expression: "variables.allContainers.map(c,\n  JSONPatch{\n    op: \"add\",\n\
        \    path: \"/metadata/annotations/\" + jsonpatch.escapeKey(\"container.apparmor.security.beta.kubernetes.io/\"\
        \ + c.name),\n    value: \"runtime/default\"\n  }\n)"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: psp-migration-mpol-add-apparmor-0b72b9-b
spec:
  policyName: psp-migration-mpol-add-apparmor-0b72b9
