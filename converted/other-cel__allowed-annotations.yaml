apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-allowed-annotations-c740b4
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.metadata.?annotations.orValue([]).all(annotation, !annotation.contains('fluxcd.io/')
      || annotation in ['fluxcd.io/cow', 'fluxcd.io/dog'])
    message: The only approved FluxCD annotations are `fluxcd.io/cow` and `fluxcd.io/dog`.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-allowed-annotations-c740b4-b
spec:
  policyName: other-cel-allowed-annotations-c740b4
  validationActions:
  - Deny
---
