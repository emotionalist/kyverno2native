apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-vpol-restricted-disallow-privil-3637c0
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers +  object.spec.?initContainers.orValue([])
      +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: variables.allContainers.all(container,  container.?securityContext.allowPrivilegeEscalation.orValue(true)
      == false)
    message: Privilege escalation is disallowed.  All containers must set the securityContext.allowPrivilegeEscalation
      field to `false`.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-vpol-restricted-disallow-privil-3637c0-b
spec:
  policyName: pod-security-vpol-restricted-disallow-privil-3637c0
  validationActions:
  - Deny
---
