apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-binding-system-groups-95073e-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusterrolebindings
      - rolebindings
  validations:
  - expression: (has(object.subjects) && (object.subjects.all(__x, (has(__x.name)
      && (__x.name != "system:anonymous")))))
    message: Binding to system:anonymous is not allowed.
