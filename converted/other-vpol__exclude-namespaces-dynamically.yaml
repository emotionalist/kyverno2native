apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-exclude-namespaces-dynamically-55d5ca
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - cronjobs
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: cm
    expression: resource.Get("v1", "configmaps", "default", "namespace-filters")
  - name: filter
    expression: request.namespace in variables.cm.data['exclude'].split(', ')
  validations:
  - expression: 'request.kind.kind == ''Pod'' ?  ( variables.filter || (has(object.metadata.labels)
      && ''foo'' in object.metadata.labels)) :  request.kind.kind in [''Deployment'',
      ''CronJob''] ? true : false

      '
    messageExpression: '''Pods must have the "foo" label in metadata.labels unless
      in namespaces: '' + variables.cm.data[''exclude''] +  (has(object.metadata.labels)
      && ''foo'' in object.metadata.labels ? '', but the label is present.'' : '',
      but no "foo" label is found.'')'
  - expression: 'request.kind.kind == ''Deployment'' ?  (  variables.filter || has(object.spec.template.metadata)
      && has(object.spec.template.metadata.labels) && ''foo'' in object.spec.template.metadata.labels)
      :  request.kind.kind in [''Pod'', ''CronJob''] ? true : false

      '
    messageExpression: '''Deployments must have the "foo" label in the Pod template
      metadata.labels unless in namespaces: '' + variables.cm.data[''exclude''] +  (has(object.spec.template.metadata)
      && has(object.spec.template.metadata.labels) && ''foo'' in object.spec.template.metadata.labels
      ? '', but the label is present.'' : '', but no "foo" label is found.'')'
  - expression: 'request.kind.kind == ''CronJob'' ?  ( variables.filter || has(object.spec.jobTemplate.spec.template.metadata)
      && has(object.spec.jobTemplate.spec.template.metadata.labels) && ''foo'' in
      object.spec.jobTemplate.spec.template.metadata.labels) :  request.kind.kind
      in [''Pod'', ''Deployment''] ? true : false

      '
    messageExpression: '''CronJobs must have the "foo" label in the Pod template metadata.labels
      unless in namespaces: '' + variables.cm.data[''exclude''] +  (has(object.spec.jobTemplate.spec.template.metadata)
      && has(object.spec.jobTemplate.spec.template.metadata.labels) && ''foo'' in
      object.spec.jobTemplate.spec.template.metadata.labels ? '', but the label is
      present.'' : '', but no "foo" label is found.'')'
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-exclude-namespaces-dynamically-55d5ca-b
spec:
  policyName: other-vpol-exclude-namespaces-dynamically-55d5ca
  validationActions:
  - Deny
