apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-limit-hostpath-type-pv-c16c6f
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - persistentvolumes
  validations:
  - expression: (has(object.spec) && ((!(has(object.spec.hostPath)) || (has(object.spec.hostPath)
      && ((has(object.spec.hostPath.path) && (object.spec.hostPath.path.matches("^/data.*$"))))))))
    message: hostPath type persistent volumes are confined to /data.
  matchConditions:
  - name: preconditions
    expression: ((request.operation == "CREATE" || request.operation == "UPDATE"))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-limit-hostpath-type-pv-c16c6f-b
spec:
  policyName: other-limit-hostpath-type-pv-c16c6f
  validationActions:
  - Deny
