apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-prepend-image-registry-b7399a
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{\n  spec: Object.spec{\n    containers: object.spec.containers.map(container,\
        \ \n      Object.spec.containers{\n        name: container.name,\n       \
        \ image: \"registry.io/\" + container.image\n      }\n    ),\n    initContainers:\
        \ has(object.spec.initContainers) ?\n      object.spec.initContainers.map(container,\n\
        \        Object.spec.initContainers{\n          name: container.name,\n  \
        \        image: \"registry.io/\" + container.image\n        }\n      ) : []\n\
        \  }\n}"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: other-mpol-prepend-image-registry-b7399a-b
spec:
  policyName: other-mpol-prepend-image-registry-b7399a
---
