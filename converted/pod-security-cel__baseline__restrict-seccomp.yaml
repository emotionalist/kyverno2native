apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-baseline-restrict-seccomp-d17f68
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (object.spec.?securityContext.?seccompProfile.?type.orValue('Localhost')  in
      variables.allowedProfileTypes) &&  (variables.allContainers.all(container,  container.?securityContext.?seccompProfile.?type.orValue('Localhost')  in
      variables.allowedProfileTypes))
    message: Use of custom Seccomp profiles is disallowed. The field spec.containers[*].securityContext.seccompProfile.type
      must be unset or set to `RuntimeDefault` or `Localhost`.
  variables:
  - name: allContainers
    expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers
      : []))'
  - name: allowedProfileTypes
    expression: '[''RuntimeDefault'', ''Localhost'']'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-baseline-restrict-seccomp-d17f68-b
spec:
  policyName: pod-security-cel-baseline-restrict-seccomp-d17f68
  validationActions:
  - Deny
---
