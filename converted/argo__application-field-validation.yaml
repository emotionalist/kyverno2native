apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argo-application-field-validation-4e7d44-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - argoproj.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - applications
  validations:
  - expression: ((has(object.spec) && ((has(object.spec.source) && ((has(object.spec.source.path)
      && (object.spec.source.path != "")) && (!(has(object.spec.source.chart))))))))
      || ((has(object.spec) && ((has(object.spec.source) && ((!(has(object.spec.source.path)))
      && (has(object.spec.source.chart) && (object.spec.source.chart != "")))))))
    message: '`spec.source.path` OR `spec.source.chart` should be specified but never
      both.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argo-application-field-validation-4e7d44-r0-b
spec:
  policyName: argo-application-field-validation-4e7d44-r0
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
