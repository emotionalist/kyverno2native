apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-restricted-require-run-as-n-126c8d
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.podLevelEnforced || variables.containerLevelEnforced
    message: Running as root is not allowed. Either the field spec.securityContext.runAsNonRoot
      or all of spec.containers[*].securityContext.runAsNonRoot, spec.initContainers[*].securityContext.runAsNonRoot
      and spec.ephemeralContainers[*].securityContext.runAsNonRoot, must be set to
      true.
  variables:
  - name: podSecurityContext
    expression: object.spec.?securityContext.orValue({})
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: podRunAsNonRoot
    expression: variables.podSecurityContext.?runAsNonRoot.orValue(false)
  - name: podLevelEnforced
    expression: "variables.podRunAsNonRoot && variables.allContainers.all(container,\n\
      \  container.?securityContext.?runAsNonRoot.orValue(true) == true\n)"
  - name: containerLevelEnforced
    expression: "variables.allContainers.all(container,\n  container.?securityContext.?runAsNonRoot.orValue(false)\
      \ == true\n)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-restricted-require-run-as-n-126c8d-b
spec:
  policyName: pod-security-cel-restricted-require-run-as-n-126c8d
  validationActions:
  - Deny
---
