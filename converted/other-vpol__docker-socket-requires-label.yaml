apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-docker-socket-requires-label-8ba768
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: hasDockerSocket
    expression: object.spec.?volumes.orValue([]).exists(volume, volume.?hostPath.?path.orValue('')
      == '/var/run/docker.sock')
  - name: isAllowDockerLabelTrue
    expression: object.metadata.?labels[?'allow-docker'].orValue('false') == 'true'
  validations:
  - expression: '!variables.hasDockerSocket || variables.isAllowDockerLabelTrue'
    message: If a hostPath volume exists and is set to `/var/run/docker.sock`, the
      label `allow-docker` must equal `true`.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-docker-socket-requires-label-8ba768-b
spec:
  policyName: other-vpol-docker-socket-requires-label-8ba768
  validationActions:
  - Deny
---
