apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: psp-migration-cel-check-supplemental-groups-be6717
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.?securityContext.?supplementalGroups.orValue([]).all(supplementalGroup,
      (supplementalGroup >= 100 && supplementalGroup <= 200) || (supplementalGroup
      >= 500 && supplementalGroup <= 600))
    message: Any supplementalGroup ID must be within the range 100-200 or 500-600.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: psp-migration-cel-check-supplemental-groups-be6717-b
spec:
  policyName: psp-migration-cel-check-supplemental-groups-be6717
  validationActions:
  - Deny
---
