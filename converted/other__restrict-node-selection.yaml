apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-node-selection-ff11a0-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (has(object.spec) && ((!(has(object.spec.nodeSelector)))))
    message: Setting the nodeSelector field is prohibited.
  matchConditions:
  - name: preconditions
    expression: (request.operation == "CREATE")
---
