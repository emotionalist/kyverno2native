apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-binding-clusteradmin-6c46a5
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusterrolebindings
      - rolebindings
  validations:
  - expression: (has(object.roleRef) && ((has(object.roleRef.name) && (object.roleRef.name
      != "cluster-admin"))))
    message: Binding to cluster-admin is not allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-binding-clusteradmin-6c46a5-b
spec:
  policyName: other-restrict-binding-clusteradmin-6c46a5
  validationActions:
  - Deny
