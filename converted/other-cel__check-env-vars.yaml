  name: other-cel-check-env-vars-a3af73
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '!object.spec.containers.exists(container,  container.?env.orValue([]).exists(e,
      e.name == ''DISABLE_OPA'' && e.value == ''true''))'
