apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-verify-flux-sources-4e75b4-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - source.toolkit.fluxcd.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - gitrepositories
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - flux-system
  validations:
  - expression: (has(object.spec) && ((has(object.spec.url) && ((object.spec.url.matches("^https://github\\.com/myorg/..*$")
      || object.spec.url.matches("^ssh://git@github\\.com:myorg/..*$"))))))
    message: .spec.url must be from a repository within the myorg organization.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-verify-flux-sources-4e75b4-r0-b
spec:
  policyName: flux-verify-flux-sources-4e75b4-r0
  validationActions:
  - Deny
---
