apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-restrict-service-port-range-ac733d
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: object.spec.ports.all(p, p.port >= 32000 && p.port <= 33000)
    message: Ports must be between 32000-33000
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-restrict-service-port-range-ac733d-b
spec:
  policyName: other-vpol-restrict-service-port-range-ac733d
  validationActions:
  - Deny
