apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-require-labels-e15519
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (has(object.metadata) && ((has(object.metadata.labels) && (("app.kubernetes.io/name"
      in object.metadata.labels && (object.metadata.labels["app.kubernetes.io/name"]
      != ""))))))
