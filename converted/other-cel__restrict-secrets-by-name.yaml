apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-restrict-secrets-by-name-ed94db-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container,  container.?env.orValue([]).all(env,
      env.?valueFrom.?secretKeyRef.?name.orValue('safe-').startsWith("safe-")))
    message: Only Secrets beginning with `safe-` may be consumed in env statements.
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
---
apiVersion: admissionregistration.k8s.io/v1
