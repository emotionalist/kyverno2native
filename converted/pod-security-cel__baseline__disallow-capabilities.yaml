apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-baseline-disallow-capabilit-a88628
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container,  container.?securityContext.?capabilities.?add.orValue([]).all(capability,
      capability == '' || capability in variables.allowedCapabilities))
    message: Any capabilities added beyond the allowed list (AUDIT_WRITE, CHOWN, DAC_OVERRIDE,
      FOWNER, FSETID, KILL, MKNOD, NET_BIND_SERVICE, SETFCAP, SETGID, SETPCAP, SETUID,
      SYS_CHROOT) are disallowed.
  variables:
  - name: allowedCapabilities
    expression: '[''AUDIT_WRITE'',''CHOWN'',''DAC_OVERRIDE'',''FOWNER'',''FSETID'',''KILL'',''MKNOD'',''NET_BIND_SERVICE'',''SETFCAP'',''SETGID'',''SETPCAP'',''SETUID'',''SYS_CHROOT'']'
  - name: allContainers
    expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers
      : []))'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-baseline-disallow-capabilit-a88628-b
spec:
  policyName: pod-security-cel-baseline-disallow-capabilit-a88628
  validationActions:
  - Deny
---
