apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argo-cel-application-prevent-updates-project-cdebe4
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - argoproj.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - applications
  validations:
  - expression: object.spec.project == oldObject.spec.project
    message: The spec.project cannot be changed once the Application is created.
  matchConditions:
  - name: operation-should-be-update
    expression: request.operation == 'UPDATE'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argo-cel-application-prevent-updates-project-cdebe4-b
spec:
  policyName: argo-cel-application-prevent-updates-project-cdebe4
  validationActions:
  - Deny
