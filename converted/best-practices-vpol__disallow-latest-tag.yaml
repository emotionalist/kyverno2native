apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-vpol-disallow-latest-tag-3e910b
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, container.image.contains(':'))
    message: An image tag is required.
  - expression: object.spec.containers.all(container, !container.image.endsWith(':latest'))
    message: Using a mutable image tag e.g. 'latest' is not allowed.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
