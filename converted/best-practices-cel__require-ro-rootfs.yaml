apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-cel-require-ro-rootfs-f9ea9d
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, container.?securityContext.?readOnlyRootFilesystem.orValue(false)
      == true)
    message: Root filesystem must be read-only.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-cel-require-ro-rootfs-f9ea9d-b
spec:
  policyName: best-practices-cel-require-ro-rootfs-f9ea9d
  validationActions:
  - Deny
---
