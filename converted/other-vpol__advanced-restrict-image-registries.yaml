apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-advanced-restrict-image-registrie-de445c
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: nsRegistries
    expression: '(has(namespaceObject.metadata.annotations) && ("corp.com/allowed-registries"
      in namespaceObject.metadata.annotations) ? namespaceObject.metadata.annotations["corp.com/allowed-registries"]
      : "").split(",").filter(reg, reg != "")'
  - name: cmRegistries
    expression: '(has(params.data) && ("registries" in params.data) ? params.data["registries"]
      : "").split(",").filter(reg, reg != "")'
  validations:
  - expression: |-
      variables.allContainers.all(container,
        (
          variables.cmRegistries.exists(cmRegistry,
            container.image.startsWith(cmRegistry.trim()))
        ) || (
          variables.nsRegistries.exists(nsRegistry,
            container.image.startsWith(nsRegistry.trim()))
        )
      )
    messageExpression: '"This Pod names an image that is not from an approved registry"
      + variables.nsRegistries.join(",") + "  " + variables.cmRegistries.join(",")'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-advanced-restrict-image-registrie-de445c-b
spec:
  policyName: other-vpol-advanced-restrict-image-registrie-de445c
  paramRef:
    name: clusterregistries
    namespace: default
    parameterNotFoundAction: Deny
  validationActions:
  - Deny
---
