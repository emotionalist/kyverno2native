apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-restricted-disallow-capabil-a6b8c8-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: "variables.allContainers.all(container,\n  has(container.securityContext)\
      \ &&\n  has(container.securityContext.capabilities) &&\n  has(container.securityContext.capabilities.drop)\
      \ &&\n  container.securityContext.capabilities.drop.exists_one(capability, capability\
      \ == 'ALL')\n)"
  variables:
  - name: allContainers
    expression: '(has(object.spec.containers) ? object.spec.containers : []) + (has(object.spec.initContainers)
      ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ?
      object.spec.ephemeralContainers : [])'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-restricted-disallow-capabil-a6b8c8-r0-b
spec:
  policyName: pod-security-cel-restricted-disallow-capabil-a6b8c8-r0
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-restricted-disallow-capabil-a6b8c8-r1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: "variables.allContainers.all(container,\n  !has(container.securityContext)\
      \ ||\n  !has(container.securityContext.capabilities) ||\n  !has(container.securityContext.capabilities.add)\
      \ ||\n  (\n    size(container.securityContext.capabilities.add) == 1 &&\n  \
      \  container.securityContext.capabilities.add[0] == 'NET_BIND_SERVICE'\n  )\n\
      )"
    message: Any capabilities added other than NET_BIND_SERVICE are disallowed.
  variables:
  - name: allContainers
    expression: '(has(object.spec.containers) ? object.spec.containers : []) + (has(object.spec.initContainers)
      ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ?
      object.spec.ephemeralContainers : [])'
---
