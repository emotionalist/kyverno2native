apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-always-pull-images-8b07b1
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{\n  spec: Object.spec{\n    containers: object.spec.containers.map(container,\
        \ \n      Object.spec.containers{\n        name: container.name,\n       \
        \ imagePullPolicy: \"Always\"\n      }\n    )\n  }\n}\n"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
