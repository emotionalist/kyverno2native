apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-baseline-restrict-sysctls-be7798
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.?securityContext.?sysctls.orValue([]).all(sysctl, sysctl
      == '' || has(sysctl.name) && sysctl.name in variables.allowedSysctls)
    message: Setting additional sysctls above the allowed type is disallowed. The
      field spec.securityContext.sysctls must be unset or not use any other names
      than kernel.shm_rmid_forced, net.ipv4.ip_local_port_range, net.ipv4.ip_unprivileged_port_start,
      net.ipv4.tcp_syncookies and net.ipv4.ping_group_range.
  variables:
  - name: allowedSysctls
    expression: '[''kernel.shm_rmid_forced'',''net.ipv4.ip_local_port_range'',''net.ipv4.ip_unprivileged_port_start'',''net.ipv4.tcp_syncookies'',''net.ipv4.ping_group_range'']'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-baseline-restrict-sysctls-be7798-b
spec:
  policyName: pod-security-cel-baseline-restrict-sysctls-be7798
  validationActions:
  - Deny
---
