apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-pod-controller-serviceaccount-d22f83-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations: &id001
      - CREATE
      - UPDATE
      resources:
      - replicationcontrollers
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations: *id001
      resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations: *id001
      resources:
      - jobs
  validations:
  - expression: '!((object.spec.template.spec.serviceAccountName != oldObject.spec.template.spec.serviceAccountName))'
    message: The serviceAccountName field may not be changed once created.
  matchConditions:
  - name: preconditions
    expression: (request.operation == "UPDATE")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-pod-controller-serviceaccount-d22f83-r0-b
spec:
  policyName: other-restrict-pod-controller-serviceaccount-d22f83-r0
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-pod-controller-serviceaccount-d22f83-r1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - cronjobs
  validations:
  - expression: '!((object.spec.jobTemplate.spec.template.spec.serviceAccountName
      != oldObject.spec.jobTemplate.spec.template.spec.serviceAccountName))'
    message: The serviceAccountName field may not be changed once created.
  matchConditions:
  - name: preconditions
    expression: (request.operation == "UPDATE")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-pod-controller-serviceaccount-d22f83-r1-b
spec:
  policyName: other-restrict-pod-controller-serviceaccount-d22f83-r1
  validationActions:
  - Deny
