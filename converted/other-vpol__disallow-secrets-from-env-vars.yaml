apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-disallow-secrets-from-env-vars-e4e0ca
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: "object.spec.containers.all(container,  container.?env.orValue([]).all(env,\
      \ \n  !has(env.valueFrom) || !has(env.valueFrom.secretKeyRef)))"
    message: Secrets must be mounted as volumes, not as environment variables.
  - expression: object.spec.containers.all(container,  container.?envFrom.orValue([]).all(envFrom,
      !has(envFrom.secretRef)))
    message: Secrets must not come from envFrom statements.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-disallow-secrets-from-env-vars-e4e0ca-b
spec:
  policyName: other-vpol-disallow-secrets-from-env-vars-e4e0ca
  validationActions:
  - Deny
---
