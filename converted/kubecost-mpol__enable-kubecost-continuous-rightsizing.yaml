apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: kubecost-mpol-enable-kubecost-continuous-rig-1f63d9
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
  matchConditions:
  - name: check-env-label
    expression: has(object.metadata.labels) && has(object.metadata.labels.env) &&
      object.metadata.labels.env == 'test'
  - name: check-annotation-not-exists
    expression: '!has(object.metadata.annotations) || !object.metadata.annotations.exists(k,
      k == ''request.autoscaling.kubecost.com/enabled'')'
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{\n  metadata: Object.metadata{\n    annotations: {\n   \
        \   \"request.autoscaling.kubecost.com/enabled\": \"true\"\n    }\n  }\n}"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: kubecost-mpol-enable-kubecost-continuous-rig-1f63d9-b
spec:
  policyName: kubecost-mpol-enable-kubecost-continuous-rig-1f63d9
