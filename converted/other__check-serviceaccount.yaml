apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-check-serviceaccount-ff30c4
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (has(object.spec) && ((has(object.spec.serviceAccountName) && (object.spec.serviceAccountName
      == "{{serviceAccountName}}"))))
    message: The ServiceAccount used to create this Pod is confined to using the same
      account when running the Pod.
  matchConditions:
  - name: preconditions
    expression: (serviceAccountName.matches("^.*.$")) && (request.operation == "CREATE")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-check-serviceaccount-ff30c4-b
spec:
  policyName: other-check-serviceaccount-ff30c4
  validationActions:
  - Deny
---
