apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-require-qos-burstable-981880
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.exists(container,  has(container.resources)
      && (has(container.resources.requests) || has(container.resources.limits)))
    message: At least one container in the Pod must define either requests or limits
      for either CPU or memory.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-require-qos-burstable-981880-b
spec:
  policyName: other-vpol-require-qos-burstable-981880
  validationActions:
  - Deny
