apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-restrict-node-port-ec0278
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: (has(object.spec) && ((!(has(object.spec.type)) || (has(object.spec.type)
      && (object.spec.type != "NodePort")))))
    message: Services of type NodePort are not allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-restrict-node-port-ec0278-b
spec:
  policyName: best-practices-restrict-node-port-ec0278
  validationActions:
  - Deny
