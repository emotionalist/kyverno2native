apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-topologyspreadconstraints-policy-694cc3
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
  validations:
  - expression: size(object.spec.template.spec.?topologySpreadConstraints.orValue([]).filter(t,
      t.topologyKey == 'kubernetes.io/hostname' || t.topologyKey == 'topology.kubernetes.io/zone'))
      == 2
    message: topologySpreadConstraint for kubernetes.io/hostname & topology.kubernetes.io/zone
      are required
  matchConditions:
  - name: replicas-must-be-3-or-more
    expression: object.spec.replicas >= 3
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-topologyspreadconstraints-policy-694cc3-b
spec:
  policyName: other-cel-topologyspreadconstraints-policy-694cc3
  validationActions:
  - Deny
