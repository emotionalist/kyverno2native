apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-cel-require-probes-971990
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, has(container.livenessProbe)
      ||  has(container.startupProbe) ||  has(container.readinessProbe))
    message: Liveness, readiness, or startup probes are required for all containers.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-cel-require-probes-971990-b
spec:
  policyName: best-practices-cel-require-probes-971990
  validationActions:
  - Deny
---
