apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-disallow-all-secrets-f400a6
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers +  object.spec.?initContainers.orValue([])
      +  object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: "variables.allContainers.all(container,  container.?env.orValue([]).all(env,\
      \ \n  !has(env.valueFrom) || !has(env.valueFrom.secretKeyRef)))"
    message: No Secrets from env.
  - expression: variables.allContainers.all(container,  container.?envFrom.orValue([]).all(envFrom,
      !has(envFrom.secretRef)))
    message: No Secrets from envFrom.
  - expression: object.spec.?volumes.orValue([]).all(volume, !has(volume.secret))
    message: No Secrets from volumes.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-disallow-all-secrets-f400a6-b
spec:
  policyName: other-vpol-disallow-all-secrets-f400a6
  validationActions:
  - Deny
---
