apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-docker-socket-requires-label-51ec73
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '!variables.hasDockerSocket || variables.isAllowDockerLabelTrue'
    message: If a hostPath volume exists and is set to `/var/run/docker.sock`, the
      label `allow-docker` must equal `true`.
  variables:
  - name: hasDockerSocket
    expression: object.spec.?volumes.orValue([]).exists(volume, volume.?hostPath.?path.orValue('')
      == '/var/run/docker.sock')
  - name: isAllowDockerLabelTrue
    expression: object.metadata.?labels[?'allow-docker'].orValue('false') == 'true'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-docker-socket-requires-label-51ec73-b
spec:
  policyName: other-cel-docker-socket-requires-label-51ec73
  validationActions:
  - Deny
---
