apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-require-storageclass-ef601c
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - persistentvolumeclaims
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - statefulsets
  validations:
  - expression: "object.kind == 'PersistentVolumeClaim' ?  object.spec.?storageClassName.orValue('')\
      \ != '' :  object.spec.?volumeClaimTemplates.orValue([]).all(volumeClaimTemplate,\
      \ \n  volumeClaimTemplate.spec.?storageClassName.orValue('') != '')"
    message: '"Storage class name is required: PersistentVolumeClaims must have a
      non-empty storageClassName,  and StatefulSets must define a non-empty storageClassName
      for all volumeClaimTemplates."'
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-require-storageclass-ef601c-b
spec:
  policyName: other-vpol-require-storageclass-ef601c
  validationActions:
  - Deny
