apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-require-deployments-have-multiple-256729
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
  validations:
  - expression: object.spec.replicas > 1
    message: Deployments should have more than one replica to ensure availability.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-require-deployments-have-multiple-256729-b
spec:
  policyName: other-vpol-require-deployments-have-multiple-256729
  validationActions:
  - Deny
