apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-restrict-secret-role-verbs-38c0be
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusterroles
      - roles
  validations:
  - expression: object.rules == null ||  !object.rules.exists(rule,  'secrets' in
      rule.resources && rule.verbs.exists(verb, verb in variables.forbiddenVerbs))
    message: Requesting verbs `get`, `list`, or `watch` on Secrets is forbidden.
  variables:
  - name: forbiddenVerbs
    expression: '[''get'',''list'',''watch'']'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-restrict-secret-role-verbs-38c0be-b
spec:
  policyName: other-cel-restrict-secret-role-verbs-38c0be
  validationActions:
  - Deny
