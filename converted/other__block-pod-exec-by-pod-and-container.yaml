apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-block-pod-exec-by-pod-and-container-3d6133
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods/exec
  validations:
  - expression: '!((object.container == "nginx"))'
    message: Nginx containers inside myapp-maintanence Pods may not be exec'd into.
  matchConditions:
  - name: preconditions
    expression: (request.operation == "CONNECT") && (request.name.matches("^myapp\\-maintenance.*$"))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-block-pod-exec-by-pod-and-container-3d6133-b
spec:
  policyName: other-block-pod-exec-by-pod-and-container-3d6133
  validationActions:
  - Deny
