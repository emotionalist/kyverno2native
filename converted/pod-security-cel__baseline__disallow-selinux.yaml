apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-baseline-disallow-selinux-1575cb-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (!has(object.spec.securityContext) || !has(object.spec.securityContext.seLinuxOptions)
      || !has(object.spec.securityContext.seLinuxOptions.type) || variables.seLinuxTypes.exists(type,
      type == object.spec.securityContext.seLinuxOptions.type)) && variables.allContainerTypes.all(container,  !has(container.securityContext)
      || !has(container.securityContext.seLinuxOptions) || !has(container.securityContext.seLinuxOptions.type)
      || variables.seLinuxTypes.exists(type, type == container.securityContext.seLinuxOptions.type))
    message: Setting the SELinux type is restricted. The field securityContext.seLinuxOptions.type
      must either be unset or set to one of the allowed values (container_t, container_init_t,
      or container_kvm_t).
  variables:
  - name: allContainerTypes
    expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers
      : []))'
  - name: seLinuxTypes
    expression: '[''container_t'', ''container_init_t'', ''container_kvm_t'']'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-baseline-disallow-selinux-1575cb-r0-b
spec:
  policyName: pod-security-cel-baseline-disallow-selinux-1575cb-r0
  validationActions:
  - Deny
---
