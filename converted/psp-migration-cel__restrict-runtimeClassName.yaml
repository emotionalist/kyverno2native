apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: psp-migration-cel-restrict-runtimeclassname-b1bfa0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '!has(object.spec.runtimeClassName) || object.spec.runtimeClassName
      in [''prodclass'', ''expclass'']'
