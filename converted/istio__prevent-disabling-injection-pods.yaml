      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(has(object.metadata) && ((!(has(object.metadata.annotations)) ||
      (has(object.metadata.annotations) && ((!("sidecar.istio.io/inject" in object.metadata.annotations)
      || ("sidecar.istio.io/inject" in object.metadata.annotations && ((type(object.metadata.annotations["sidecar.istio.io/inject"])
