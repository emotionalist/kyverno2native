apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-allowed-pod-priorities-0538da
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: namespaceName
    expression: namespaceObject.metadata.name
  - name: priorities
    expression: 'variables.namespaceName in params.data ? params.data[variables.namespaceName].split('', '')
      : []'
  validations:
  - expression: 'variables.priorities == [] || object.spec.?priorityClassName.orValue('''')
      in variables.priorities'
    messageExpression: '''The Pod PriorityClass '' + object.spec.?priorityClassName.orValue('''')
      + '' is not in the list of the following PriorityClasses allowed in this Namespace: ''
      + params.data[variables.namespaceName]'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-allowed-pod-priorities-0538da-b
spec:
  policyName: other-vpol-allowed-pod-priorities-0538da
  paramRef:
    name: allowed-pod-priorities
    namespace: default
    parameterNotFoundAction: Allow
  validationActions:
  - Deny
---
