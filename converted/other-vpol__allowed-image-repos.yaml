apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-allowed-image-repos-432adc
spec:
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: allowedRepos
    expression: '["myknownimage", "kyverno"]'
  matchConstraints:
    resourceRules:
    - resources:
      - pods
      operations:
      - CREATE
      - UPDATE
      apiGroups:
      - ''
      apiVersions:
      - v1
  validations:
  - messageExpression: '''All images in this Pod must come from an authorized repository.
      Allowed repositories: '' + variables.allowedRepos.join('', '') + ''. Found unauthorized
      images: '' + variables.allContainers.filter(container, !variables.allowedRepos.exists(repo,
      (container.image.contains(''/'') ? container.image.split(''/'')[container.image.split(''/'').size()
      - 1].split('':'')[0] : container.image.split('':'')[0]) == repo)).map(container,
      container.image).join('', '')

      '
    expression: 'variables.allContainers.all(container, variables.allowedRepos.exists(repo,
      (container.image.contains(''/'') ? container.image.split(''/'')[container.image.split(''/'').size()
      - 1].split('':'')[0] : container.image.split('':'')[0]) == repo))'
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-allowed-image-repos-432adc-b
spec:
  policyName: other-vpol-allowed-image-repos-432adc
  validationActions:
  - Deny
---
