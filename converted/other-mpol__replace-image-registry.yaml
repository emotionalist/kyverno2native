apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-replace-image-registry-3ea052
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: |
        Object{
          spec: Object.spec{
            containers: object.spec.containers.map(c,
              Object.spec.containers{
                name: c.name,
                image: 'myregistry.corp.com/' +
                  (c.image.contains('/') && c.image.split('/')[0].contains('.') ?
                    c.image.substring(c.image.indexOf('/') + 1) :
                    c.image.replace('localhost/', ''))
              }
            ),
            initContainers: object.spec.?initContainers.orValue([]).map(c,
              Object.spec.initContainers{
                name: c.name,
                image: 'myregistry.corp.com/' +
                  (c.image.contains('/') && c.image.split('/')[0].contains('.') ?
                    c.image.substring(c.image.indexOf('/') + 1) :
                    c.image.replace('localhost/', ''))
              }
            )
          }
        }
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: other-mpol-replace-image-registry-3ea052-b
spec:
  policyName: other-mpol-replace-image-registry-3ea052
