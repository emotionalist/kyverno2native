apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-prevent-cr8escape-1d73cc
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: 'object.spec.?securityContext.?sysctls.orValue([]).all(sysctl,  !has(sysctl.value)
      || (!sysctl.value.contains(''+'') && !sysctl.value.contains(''=''))) '
    message: characters '+' or '=' are not allowed in sysctls values
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-prevent-cr8escape-1d73cc-b
spec:
  policyName: other-vpol-prevent-cr8escape-1d73cc
  validationActions:
  - Deny
---
