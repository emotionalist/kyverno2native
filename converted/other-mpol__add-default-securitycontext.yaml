apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-add-default-securitycontext-3e90e4
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{\n  spec: Object.spec{\n    securityContext: Object.spec.securityContext{\n\
        \      runAsNonRoot: has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)\n\
        \                   ? object.spec.securityContext.runAsNonRoot\n         \
        \          : true,\n      runAsUser: has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser)\n\
        \                 ? object.spec.securityContext.runAsUser\n              \
        \   : 1000,\n      runAsGroup: has(object.spec.securityContext) && has(object.spec.securityContext.runAsGroup)\n\
        \                  ? object.spec.securityContext.runAsGroup\n            \
        \      : 3000,\n      fsGroup: has(object.spec.securityContext) && has(object.spec.securityContext.fsGroup)\n\
        \               ? object.spec.securityContext.fsGroup\n               : 2000\
        \            \n    }\n  }\n}"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: other-mpol-add-default-securitycontext-3e90e4-b
