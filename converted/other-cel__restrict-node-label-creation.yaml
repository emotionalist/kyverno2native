apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-restrict-node-label-creation-4e143d
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - nodes
  validations:
  - expression: 'false'
    message: Setting the `foo` label on a Node is not allowed.
  matchConditions:
  - name: operation-should-be-update
    expression: request.operation == 'UPDATE'
  - name: has-foo-label
    expression: object.metadata.?labels.?foo.hasValue()
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-restrict-node-label-creation-4e143d-b
spec:
  policyName: other-cel-restrict-node-label-creation-4e143d
  validationActions:
  - Deny
