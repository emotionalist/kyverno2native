apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-advanced-restrict-image-registries-1cde6d
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container, container.image.startsWith(variables.nsregistries)
      || container.image.startsWith(variables.clusterregistries))
    message: This Pod names an image that is not from an approved registry.
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: nsregistries
    expression: namespaceObject.metadata.?annotations[?'corp.com/allowed-registries'].orValue('
      ')
  - name: clusterregistries
    expression: params.data[?'registries'].orValue(' ')
  paramKind:
    apiVersion: v1
    kind: ConfigMap
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-advanced-restrict-image-registries-1cde6d-b
spec:
  policyName: other-cel-advanced-restrict-image-registries-1cde6d
  validationActions:
  - Deny
  paramRef:
    name: clusterregistries
    namespace: default
    parameterNotFoundAction: Deny
---
