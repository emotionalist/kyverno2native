kind: ValidatingAdmissionPolicy
metadata:
  name: other-require-storageclass-d71ae4-r1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - statefulsets
  validations:
  - expression: (has(object.spec) && ((!(has(object.spec.volumeClaimTemplates)) ||
      (has(object.spec.volumeClaimTemplates) && (object.spec.volumeClaimTemplates.all(__x,
      (has(__x.spec) && ((has(__x.spec.storageClassName) && (__x.spec.storageClassName
      != ""))))))))))
