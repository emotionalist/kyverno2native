---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-require-storageclass-d71ae4-r0-b
spec:
  policyName: other-require-storageclass-d71ae4-r0
  validationActions:
  - Deny
