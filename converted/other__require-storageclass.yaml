apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-require-storageclass-d71ae4-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - persistentvolumeclaims
  validations:
  - expression: (has(object.spec) && ((has(object.spec.storageClassName) && (object.spec.storageClassName
      != ""))))
