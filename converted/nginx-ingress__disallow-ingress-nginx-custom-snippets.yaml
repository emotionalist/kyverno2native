apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nginx-ingress-disallow-ingress-nginx-custom-83733e-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - configmaps
  validations:
  - expression: '(!(has(object.data)) || (has(object.data) && ((!("allow-snippet-annotations"
      in object.data) || ("allow-snippet-annotations" in object.data && ((type(object.data["allow-snippet-annotations"])
      == bool ? object.data["allow-snippet-annotations"] == false : object.data["allow-snippet-annotations"]
      == "false")))))))'
    message: ingress-nginx allow-snippet-annotations must be set to false
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nginx-ingress-disallow-ingress-nginx-custom-83733e-r0-b
spec:
  policyName: nginx-ingress-disallow-ingress-nginx-custom-83733e-r0
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nginx-ingress-disallow-ingress-nginx-custom-83733e-r1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: (has(object.metadata) && ((!(has(object.metadata.annotations)) ||
      (has(object.metadata.annotations) && ((!has(object.metadata.annotations) ||
      !object.metadata.annotations.exists(__k2, __k2.matches("^.*\\-snippet$") &&
      (object.metadata.annotations[__k2] != ""))))))))
    message: ingress-nginx custom snippets are not allowed
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nginx-ingress-disallow-ingress-nginx-custom-83733e-r1-b
spec:
  policyName: nginx-ingress-disallow-ingress-nginx-custom-83733e-r1
  validationActions:
  - Deny
