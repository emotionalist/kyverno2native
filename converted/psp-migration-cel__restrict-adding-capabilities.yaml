apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: psp-migration-cel-restrict-adding-capabiliti-fd7fcb
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container,  container.?securityContext.?capabilities.?add.orValue([]).all(capability,
      capability in variables.allowedCapabilities))
    message: Any capabilities added other than NET_BIND_SERVICE or CAP_CHOWN are disallowed.
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: allowedCapabilities
    expression: '[''NET_BIND_SERVICE'', ''CAP_CHOWN'']'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: psp-migration-cel-restrict-adding-capabiliti-fd7fcb-b
spec:
  policyName: psp-migration-cel-restrict-adding-capabiliti-fd7fcb
  validationActions:
  - Deny
---
