apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-require-qos-guaranteed-c5f247
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, has(container.resources) &&  has(container.resources.requests)
      && has(container.resources.requests.cpu) && has(container.resources.requests.memory)
      && has(container.resources.limits) &&  has(container.resources.limits.cpu) &&
      has(container.resources.limits.memory) && container.resources.requests.cpu ==
      container.resources.limits.cpu && container.resources.requests.memory == container.resources.limits.memory)
    message: All containers must define memory and CPU requests and limits where they
      are equal.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-require-qos-guaranteed-c5f247-b
spec:
  policyName: other-cel-require-qos-guaranteed-c5f247
  validationActions:
  - Deny
---
