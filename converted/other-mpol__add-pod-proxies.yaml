apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: other-mpol-add-pod-proxies-cdb873
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - daemonsets
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
      - cronjobs
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: "object.kind == \"Pod\" ?\nobject.spec.containers.map(container,\n\
        \  object.spec.containers.indexOf(container)\n).map(idx,\n  JSONPatch{\n \
        \   op: has(object.spec.containers[idx].env) ? \"replace\" : \"add\",\n  \
        \  path: \"/spec/containers/\" + string(idx) + \"/env\",\n    value: [\n \
        \     {\"name\": \"HTTP_PROXY\", \"value\": \"http://proxy.corp.domain:8080\"\
        },\n      {\"name\": \"HTTPS_PROXY\", \"value\": \"https://secureproxy.corp.domain:8080\"\
        },\n      {\"name\": \"NO_PROXY\", \"value\": \"localhost,*.example.com\"\
        }\n    ] + (has(object.spec.containers[idx].env) ?\n      object.spec.containers[idx].env.filter(e,\
        \ \n        e.name != \"HTTP_PROXY\" && \n        e.name != \"HTTPS_PROXY\"\
        \ && \n        e.name != \"NO_PROXY\"\n      ) :\n      []\n    )\n  }\n)\
        \ : []\n"
  - patchType: JSONPatch
    jsonPatch:
      expression: "object.kind in [\"Deployment\", \"DaemonSet\", \"StatefulSet\"\
        ] ?\nobject.spec.template.spec.containers.map(container,\n  object.spec.template.spec.containers.indexOf(container)\n\
        ).map(idx,\n  JSONPatch{\n    op: has(object.spec.template.spec.containers[idx].env)\
        \ ? \"replace\" : \"add\",\n    path: \"/spec/template/spec/containers/\"\
        \ + string(idx) + \"/env\",\n    value: [\n      {\"name\": \"HTTP_PROXY\"\
        , \"value\": \"http://proxy.corp.domain:8080\"},\n      {\"name\": \"HTTPS_PROXY\"\
        , \"value\": \"https://secureproxy.corp.domain:8080\"},\n      {\"name\":\
        \ \"NO_PROXY\", \"value\": \"localhost,*.example.com\"}\n    ] + (has(object.spec.template.spec.containers[idx].env)\
        \ ?\n      object.spec.template.spec.containers[idx].env.filter(e, \n    \
        \    e.name != \"HTTP_PROXY\" && \n        e.name != \"HTTPS_PROXY\" && \n\
        \        e.name != \"NO_PROXY\"\n      ) :\n      []\n    )\n  }\n) : []\n"
  - patchType: JSONPatch
    jsonPatch:
      expression: "object.kind == \"Job\" ?\nobject.spec.template.spec.containers.map(container,\n\
        \  object.spec.template.spec.containers.indexOf(container)\n).map(idx,\n \
        \ JSONPatch{\n    op: has(object.spec.template.spec.containers[idx].env) ?\
        \ \"replace\" : \"add\",\n    path: \"/spec/template/spec/containers/\" +\
        \ string(idx) + \"/env\",\n    value: [\n      {\"name\": \"HTTP_PROXY\",\
        \ \"value\": \"http://proxy.corp.domain:8080\"},\n      {\"name\": \"HTTPS_PROXY\"\
        , \"value\": \"https://secureproxy.corp.domain:8080\"},\n      {\"name\":\
        \ \"NO_PROXY\", \"value\": \"localhost,*.example.com\"}\n    ] + (has(object.spec.template.spec.containers[idx].env)\
        \ ?\n      object.spec.template.spec.containers[idx].env.filter(e, \n    \
        \    e.name != \"HTTP_PROXY\" && \n        e.name != \"HTTPS_PROXY\" && \n\
        \        e.name != \"NO_PROXY\"\n      ) :\n      []\n    )\n  }\n) : []\n"
  - patchType: JSONPatch
    jsonPatch:
      expression: "object.kind == \"CronJob\" ?\nobject.spec.jobTemplate.spec.template.spec.containers.map(container,\n\
        \  object.spec.jobTemplate.spec.template.spec.containers.indexOf(container)\n\
        ).map(idx,\n  JSONPatch{\n    op: has(object.spec.jobTemplate.spec.template.spec.containers[idx].env)\
        \ ? \"replace\" : \"add\",\n    path: \"/spec/jobTemplate/spec/template/spec/containers/\"\
        \ + string(idx) + \"/env\",\n    value: [\n      {\"name\": \"HTTP_PROXY\"\
        , \"value\": \"http://proxy.corp.domain:8080\"},\n      {\"name\": \"HTTPS_PROXY\"\
        , \"value\": \"https://secureproxy.corp.domain:8080\"},\n      {\"name\":\
        \ \"NO_PROXY\", \"value\": \"localhost,*.example.com\"}\n    ] + (has(object.spec.jobTemplate.spec.template.spec.containers[idx].env)\
        \ ?\n      object.spec.jobTemplate.spec.template.spec.containers[idx].env.filter(e,\
        \ \n        e.name != \"HTTP_PROXY\" && \n        e.name != \"HTTPS_PROXY\"\
        \ && \n        e.name != \"NO_PROXY\"\n      ) :\n      []\n    )\n  }\n)\
        \ : []"
  failurePolicy: Fail
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: other-mpol-add-pod-proxies-cdb873-b
spec:
  policyName: other-mpol-add-pod-proxies-cdb873
