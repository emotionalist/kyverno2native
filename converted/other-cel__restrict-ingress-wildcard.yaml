apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-restrict-ingress-wildcard-dc7fa5
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: '!object.spec.?rules.orValue([]).exists(rule, has(rule.host) && rule.host.contains(''*''))'
    message: Wildcards are not permitted as hosts.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-restrict-ingress-wildcard-dc7fa5-b
spec:
  policyName: other-cel-restrict-ingress-wildcard-dc7fa5
  validationActions:
  - Deny
