apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: best-practices-vpol-restrict-image-registrie-af59df
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - pods/ephemeralcontainers
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: variables.allContainers.all(container, container.image.startsWith('eu.foo.io/')
      || container.image.startsWith('bar.io/'))
    message: Unknown image registry.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: best-practices-vpol-restrict-image-registrie-af59df-b
spec:
  policyName: best-practices-vpol-restrict-image-registrie-af59df
  validationActions:
  - Deny
---
