apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-restrict-deprecated-registry-8ced9b
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: variables.allContainers.all(container, !container.image.startsWith('k8s.gcr.io/'))
    message: The "k8s.gcr.io" image registry is deprecated. "registry.k8s.io" should
      now be used.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-restrict-deprecated-registry-8ced9b-b
spec:
  policyName: other-vpol-restrict-deprecated-registry-8ced9b
  validationActions:
  - Deny
---
