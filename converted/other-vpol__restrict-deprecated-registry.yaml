  name: other-vpol-restrict-deprecated-registry-8ced9b-ag1
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations: &id001
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations: *id001
      resources:
      - jobs
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations: *id001
      resources:
      - replicationcontrollers
  variables:
  - name: allContainers
    expression: object.spec.template.spec.containers + object.spec.template.spec.?initContainers.orValue([])
      + object.spec.template.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: variables.allContainers.all(container, !container.image.startsWith('k8s.gcr.io/'))
    message: The "k8s.gcr.io" image registry is deprecated. "registry.k8s.io" should
      now be used.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-restrict-deprecated-registry-8ced9b-ag1-b
spec:
  policyName: other-vpol-restrict-deprecated-registry-8ced9b-ag1
  validationActions:
  - Deny
---
