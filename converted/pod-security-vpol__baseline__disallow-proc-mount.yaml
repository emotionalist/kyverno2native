apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-vpol-baseline-disallow-proc-mou-19dd3d
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: "object.spec.containers + \n  object.spec.?initContainers.orValue([])\
      \ + \n  object.spec.?ephemeralContainers.orValue([])"
  validations:
  - expression: variables.allContainers.all(container, container.?securityContext.?procMount.orValue('Default')
      == 'Default')
    message: Changing the proc mount from the default is not allowed.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-vpol-baseline-disallow-proc-mou-19dd3d-b
spec:
  policyName: pod-security-vpol-baseline-disallow-proc-mou-19dd3d
  validationActions:
  - Deny
---
