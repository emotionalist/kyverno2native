apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-block-kubectl-cp-cd01ab
spec:
  matchConstraints:
    resourceRules:
    - resources:
      - pods/exec
      operations:
      - CONNECT
      apiGroups:
      - ''
      apiVersions:
      - v1
  validations:
  - message: 'Cannot use `kubectl cp` on pods

      '
    expression: 'object.command.size() >= 2 && object.command[0] != "tar" && object.command[1]
      != "cf"

      '
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-block-kubectl-cp-cd01ab-b
spec:
  policyName: other-vpol-block-kubectl-cp-cd01ab
  validationActions:
  - Deny
