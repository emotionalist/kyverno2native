apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-disallow-all-secrets-f908cf
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container,  container.?env.orValue([]).all(env,
      env.?valueFrom.?secretKeyRef.orValue(true)))
    message: No Secrets from env.
  - expression: variables.allContainers.all(container,  container.?envFrom.orValue([]).all(envFrom,
      !has(envFrom.secretRef)))
    message: No Secrets from envFrom.
  - expression: object.spec.?volumes.orValue([]).all(volume, !has(volume.secret))
    message: No Secrets from volumes.
  variables:
  - name: allContainers
    expression: object.spec.containers +  object.spec.?initContainers.orValue([])
      +  object.spec.?ephemeralContainers.orValue([])
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-disallow-all-secrets-f908cf-b
spec:
  policyName: other-cel-disallow-all-secrets-f908cf
  validationActions:
  - Deny
---
