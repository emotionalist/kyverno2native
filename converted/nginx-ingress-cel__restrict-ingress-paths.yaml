apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nginx-ingress-cel-restrict-ingress-paths-0cf623
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: object.spec.?rules.orValue([]).all(rule,  rule.?http.?paths.orValue([]).all(p,  !p.path.contains('/etc')
      && !p.path.contains('/var/run/secrets') && !p.path.contains('/root') && !p.path.contains('/var/run/kubernetes/serviceaccount')
      && !p.path.contains('/etc/kubernetes/admin.conf')))
    message: spec.rules[].http.paths[].path value is not allowed
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nginx-ingress-cel-restrict-ingress-paths-0cf623-b
spec:
  policyName: nginx-ingress-cel-restrict-ingress-paths-0cf623
  validationActions:
  - Deny
