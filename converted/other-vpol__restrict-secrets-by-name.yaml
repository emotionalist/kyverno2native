apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-restrict-secrets-by-name-2eddf5
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allc
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: variables.allContainers.all(container,  container.?env.orValue([]).all(env,
      env.?valueFrom.?secretKeyRef.?name.orValue('safe-').startsWith("safe-")))
    message: Only Secrets beginning with `safe-` may be consumed in env statements.
  - expression: variables.allc.all(container,  container.?envFrom.orValue([]).all(env,
      env.?secretRef.?name.orValue('safe-').startsWith("safe-")))
    message: Only Secrets beginning with `safe-` may be consumed in envFrom statements.
  - expression: object.spec.?volumes.orValue([]).all(volume, volume.?secret.?secretName.orValue('safe-').startsWith("safe-"))
    message: Only Secrets beginning with `safe-` may be consumed in volumes.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-restrict-secrets-by-name-2eddf5-b
spec:
  policyName: other-vpol-restrict-secrets-by-name-2eddf5
  validationActions:
  - Deny
---
