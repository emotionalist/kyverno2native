apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-ingress-classes-3acd3e
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
  validations:
  - expression: (has(object.metadata) && ((has(object.metadata.annotations) && (("kubernetes.io/ingress.class"
      in object.metadata.annotations && ((object.metadata.annotations["kubernetes.io/ingress.class"]
      == "HAProxy" || object.metadata.annotations["kubernetes.io/ingress.class"] ==
      "nginx")))))))
    message: Unknown ingress class.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-ingress-classes-3acd3e-b
spec:
  policyName: other-restrict-ingress-classes-3acd3e
  validationActions:
  - Deny
