apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-deny-secret-service-account-token-0f5e7e
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
  validations:
  - expression: object.type != 'kubernetes.io/service-account-token'
    message: Secret ServiceAccount token type is not allowed.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-deny-secret-service-account-token-0f5e7e-b
spec:
  policyName: other-vpol-deny-secret-service-account-token-0f5e7e
  validationActions:
  - Deny
