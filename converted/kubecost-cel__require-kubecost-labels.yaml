apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubecost-cel-require-kubecost-labels-1c4fe8
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.metadata.?labels.?owner.orValue('') != '' &&  object.metadata.?labels.?team.orValue('')
      != '' && object.metadata.?labels.?department.orValue('') != '' && object.metadata.?labels.?app.orValue('')
      != '' && object.metadata.?labels.?env.orValue('') != ''
    message: The Kubecost labels `owner`, `team`, `department`, `app`, and `env` are
      all required for Pods.
