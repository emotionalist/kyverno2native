apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: istio-enforce-strict-mtls-f24587
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - security.istio.io
      apiVersions:
      - v1beta1
      operations:
      - CREATE
      - UPDATE
      resources:
      - peerauthentications
  validations:
  - expression: (!(has(object.spec)) || (has(object.spec) && ((!(has(object.spec.mtls))
      || (has(object.spec.mtls) && ((!(has(object.spec.mtls.mode)) || (has(object.spec.mtls.mode)
      && ((object.spec.mtls.mode == "UNSET" || object.spec.mtls.mode == "STRICT"))))))))))
    message: PeerAuthentication resources may only set UNSET or STRICT for the mode.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: istio-enforce-strict-mtls-f24587-b
spec:
  policyName: istio-enforce-strict-mtls-f24587
  validationActions:
  - Deny
