apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-vpol-baseline-disallow-host-por-827432
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: "object.spec.containers + \n object.spec.?initContainers.orValue([])\
      \ + \n object.spec.?ephemeralContainers.orValue([])"
  validations:
  - expression: "variables.allContainers.all(container, \n  container.?ports.orValue([]).all(port,\
      \ port.?hostPort.orValue(0) == 0))"
    message: Use of host ports is disallowed. The field spec.containers[*].ports[*].hostPort
      must either be unset or set to `0`.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-vpol-baseline-disallow-host-por-827432-b
spec:
  policyName: pod-security-vpol-baseline-disallow-host-por-827432
  validationActions:
  - Deny
---
