  policyName: flux-cel-verify-flux-sources-6298f5-r2
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-cel-verify-flux-sources-6298f5-r3
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - image.toolkit.fluxcd.io
      apiVersions:
      - v1beta2
      operations:
      - CREATE
      - UPDATE
      resources:
      - imagerepositories
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - flux-system
  validations:
  - expression: object.spec.?image.orValue('').startsWith('ghcr.io/myorg/')
    message: .spec.image must be from an image repository within the myorg organization.
