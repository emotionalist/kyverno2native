apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-cel-verify-flux-sources-6298f5-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - source.toolkit.fluxcd.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - gitrepositories
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - flux-system
  validations:
  - expression: object.spec.url.startsWith('https://github.com/myorg/') || object.spec.url.startsWith('ssh://git@github.com:myorg/')
    message: .spec.url must be from a repository within the myorg organization.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-cel-verify-flux-sources-6298f5-r0-b
spec:
  policyName: flux-cel-verify-flux-sources-6298f5-r0
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-cel-verify-flux-sources-6298f5-r1
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - source.toolkit.fluxcd.io
      apiVersions:
      - v1beta2
      operations:
      - CREATE
      - UPDATE
      resources:
      - buckets
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - flux-system
  validations:
  - expression: object.spec.?endpoint.orValue('').endsWith('.myorg.com')
    message: .spec.endpoint must reference an address within the myorg organization.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-cel-verify-flux-sources-6298f5-r1-b
spec:
  policyName: flux-cel-verify-flux-sources-6298f5-r1
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: flux-cel-verify-flux-sources-6298f5-r2
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - source.toolkit.fluxcd.io
      apiVersions:
      - v1beta2
      operations:
      - CREATE
      - UPDATE
      resources:
      - helmrepositories
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - flux-system
  validations:
  - expression: object.spec.url.matches('^https://[a-zA-Z0-9-]+[.]myorg[.]com/.*$')
    message: .spec.url must be from a repository within the myorg organization.
---
apiVersion: admissionregistration.k8s.io/v1
