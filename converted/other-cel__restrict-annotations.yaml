apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-restrict-annotations-8f1427
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations: &id001
      - CREATE
      - UPDATE
      resources:
      - pods
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations: *id001
      resources:
      - daemonsets
      - deployments
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations: *id001
      resources:
      - cronjobs
      - jobs
  validations:
  - expression: '!object.metadata.?annotations.orValue([]).exists(annotation, annotation.startsWith(''fluxcd.io/''))'
    message: Cannot use Flux v1 annotation.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-restrict-annotations-8f1427-b
spec:
  policyName: other-cel-restrict-annotations-8f1427
  validationActions:
  - Deny
