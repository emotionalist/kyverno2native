apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-imagepullpolicy-always-a41011
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: 'object.spec.containers.all(container,  (container.image.endsWith('':latest'')
      || !container.image.contains('':'')) ?  container.imagePullPolicy == ''Always''
      : true)'
    message: The imagePullPolicy must be set to `Always` when the tag `latest` is
      used.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-imagepullpolicy-always-a41011-b
spec:
  policyName: other-cel-imagepullpolicy-always-a41011
  validationActions:
  - Deny
