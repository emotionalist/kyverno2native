apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: istio-enforce-sidecar-injection-namespace-c2ab7d
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - namespaces
  validations:
  - expression: (has(object.metadata) && ((has(object.metadata.labels) && (("istio-injection"
      in object.metadata.labels && (object.metadata.labels["istio-injection"] == "enabled"))))))
    message: All new Namespaces must have Istio sidecar injection enabled.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: istio-enforce-sidecar-injection-namespace-c2ab7d-b
spec:
  policyName: istio-enforce-sidecar-injection-namespace-c2ab7d
  validationActions:
  - Deny
