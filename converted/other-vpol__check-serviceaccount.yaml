apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-check-serviceaccount-97bcdd
spec:
  variables:
  - name: creatorServiceAccount
    expression: parseServiceAccount(request.userInfo.username)
  - name: podServiceAccountName
    expression: object.spec.?serviceAccountName.orValue('default')
  matchConstraints:
    resourceRules:
    - resources:
      - pods
      operations:
      - CREATE
      apiGroups:
      - ''
      apiVersions:
      - v1
  validations:
  - message: The ServiceAccount used to create this Pod is confined to using the same
      account when running the Pod.
    expression: '!request.userInfo.username.startsWith(''system:serviceaccount:'')
      || variables.creatorServiceAccount.Name == variables.podServiceAccountName'
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-check-serviceaccount-97bcdd-b
spec:
  policyName: other-vpol-check-serviceaccount-97bcdd
  validationActions:
  - Deny
---
