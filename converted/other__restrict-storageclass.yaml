apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-storageclass-79596e
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - storage.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - storageclasses
  validations:
  - expression: (has(object.reclaimPolicy) && (object.reclaimPolicy == "Delete"))
    message: StorageClass must define a reclaimPolicy of Delete.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-storageclass-79596e-b
spec:
  policyName: other-restrict-storageclass-79596e
  validationActions:
  - Deny
