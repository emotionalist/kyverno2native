apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-exclude-namespaces-dynamically-544ef5-r0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations: &id001
      - CREATE
      - UPDATE
      resources:
      - daemonsets
      - deployments
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations: *id001
      resources:
      - jobs
  validations:
  - expression: has(object.spec.template.metadata) && has(object.spec.template.metadata.labels)
      && 'foo' in object.spec.template.metadata.labels
    messageExpression: '''Creating Pods in the '' + request.namespace + '' namespace,''
      + '' which is not in the excluded list of namespaces'' + params.data.exclude
      + '','' + '' is forbidden unless it carries the label `foo`.''

      '
  matchConditions:
  - name: filter-namespaces
    expression: '!(request.namespace in params.data[''exclude''].split('', ''))'
  paramKind:
    apiVersion: v1
    kind: ConfigMap
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-exclude-namespaces-dynamically-544ef5-r0-b
spec:
  policyName: other-cel-exclude-namespaces-dynamically-544ef5-r0
  validationActions:
  - Deny
  paramRef:
    name: namespace-filters
    namespace: default
    parameterNotFoundAction: Deny
---
