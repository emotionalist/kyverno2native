apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-deny-commands-in-exec-probe-313970
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container,  !container.?livenessProbe.?exec.?command.orValue([]).exists(command,  command.matches('\\bjcmd\\b')
      || command.matches('\\bps\\b') || command.matches('\\bls\\b')))
    message: Cannot use commands `jcmd`, `ps`, or `ls` in liveness probes.
  matchConditions:
  - name: check-liveness-probes-commands-exist
    expression: object.spec.containers.exists(container, size(container.?livenessProbe.?exec.?command.orValue([]))
      > 0)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-deny-commands-in-exec-probe-313970-b
spec:
  policyName: other-cel-deny-commands-in-exec-probe-313970
  validationActions:
  - Deny
---
