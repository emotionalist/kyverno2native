apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-baseline-disallow-host-port-5a5b3d
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: variables.allContainers.all(container,  container.?ports.orValue([]).all(port,
      port.?hostPort.orValue(0) == 0))
    message: Use of host ports is disallowed. The fields spec.containers[*].ports[*].hostPort,
      spec.initContainers[*].ports[*].hostPort, and spec.ephemeralContainers[*].ports[*].hostPort
      must either be unset or set to `0`.
  variables:
  - name: allContainers
    expression: object.spec.containers +  object.spec.?initContainers.orValue([])
      +  object.spec.?ephemeralContainers.orValue([])
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-baseline-disallow-host-port-5a5b3d-b
spec:
  policyName: pod-security-cel-baseline-disallow-host-port-5a5b3d
  validationActions:
  - Deny
---
