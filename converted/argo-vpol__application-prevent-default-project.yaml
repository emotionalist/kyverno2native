apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: argo-vpol-application-prevent-default-projec-b78ee1
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - argoproj.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - applications
  validations:
  - message: The default project may not be used in an Application.
    expression: object.spec.?project.orValue('') != 'default'
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: argo-vpol-application-prevent-default-projec-b78ee1-b
spec:
  policyName: argo-vpol-application-prevent-default-projec-b78ee1
  validationActions:
  - Deny
