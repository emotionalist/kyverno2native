apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-vpol-restrict-secret-role-verbs-d29ccf
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - roles
      - clusterroles
  variables:
  - name: forbiddenVerbs
    expression: '[''get'',''list'',''watch'']'
  validations:
  - expression: object.rules == null ||  !object.rules.exists(rule,  'secrets' in
      rule.resources && rule.verbs.exists(verb, verb in variables.forbiddenVerbs))
    message: Requesting verbs `get`, `list`, or `watch` on Secrets is forbidden.
  failurePolicy: Fail
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-vpol-restrict-secret-role-verbs-d29ccf-b
spec:
  policyName: other-vpol-restrict-secret-role-verbs-d29ccf
  validationActions:
  - Deny
