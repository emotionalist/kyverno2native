apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-security-cel-baseline-disallow-host-path-ec705a
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.?volumes.orValue([]).all(volume, size(volume) == 0 ||
      !has(volume.hostPath))
    message: HostPath volumes are forbidden. The field spec.volumes[*].hostPath must
      be unset
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-security-cel-baseline-disallow-host-path-ec705a-b
spec:
  policyName: pod-security-cel-baseline-disallow-host-path-ec705a
  validationActions:
  - Deny
---
