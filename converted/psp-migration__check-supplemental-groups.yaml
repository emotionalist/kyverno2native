apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: psp-migration-check-supplemental-groups-5bdb9e
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: (has(object.spec) && ((!(has(object.spec.securityContext)) || (has(object.spec.securityContext)
      && ((!(has(object.spec.securityContext.supplementalGroups)) || (has(object.spec.securityContext.supplementalGroups)
      && ((object.spec.securityContext.supplementalGroups == "100-200" || object.spec.securityContext.supplementalGroups
      == "500-600")))))))))
    message: Any supplementalGroup ID must be within the range 100-200 or 500-600.
  matchConditions:
  - name: preconditions
    expression: ((request.operation == "CREATE" || request.operation == "UPDATE"))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: psp-migration-check-supplemental-groups-5bdb9e-b
spec:
  policyName: psp-migration-check-supplemental-groups-5bdb9e
  validationActions:
  - Deny
