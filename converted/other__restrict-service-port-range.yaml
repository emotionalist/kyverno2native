apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-restrict-service-port-range-bc365f
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
  validations:
  - expression: (has(object.spec) && ((has(object.spec.ports) && (object.spec.ports.all(__x,
      (has(__x.port) && (__x.port == "32000-33000")))))))
    message: Ports must be between 32000-33000
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-restrict-service-port-range-bc365f-b
spec:
  policyName: other-restrict-service-port-range-bc365f
  validationActions:
  - Deny
