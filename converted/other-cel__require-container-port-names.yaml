apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: other-cel-require-container-port-names-6093dc
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: object.spec.containers.all(container, container.?ports.orValue([]).all(port,
      has(port.name)))
    message: Name is required for every containerPort.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: other-cel-require-container-port-names-6093dc-b
spec:
  policyName: other-cel-require-container-port-names-6093dc
  validationActions:
  - Deny
---
